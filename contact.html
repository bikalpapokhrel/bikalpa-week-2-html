      <a href="contact.html">Contact</a>
    </nav>

  <main>
    <section>
      <h2>Practice Contact Form</h2>
      <p>This form is only an HTML example. It does not send a message because there is no server.</p>
      <form action="" method="post">
        <p><label for="contact-name">Name:</label><input type="text" id="contact-name" name="name" required></p>
        <p><label for="contact-email">Email:</label><input type="email" id="contact-email" name="email" required></p>
        <p><label for="contact-message">Message:</label><br><textarea id="contact-message" name="message" rows="4" cols="40"></textarea></p>
        <button type="submit">Submit</button>
      </form>
    </section>
    <section>
      <h2>College Area</h2>
      <iframe src="https://maps.google.com/maps?q=PCPS%20College%20Kupondole%20Lalitpur&amp;output=embed" title="Map of PCPS College area" width="500" height="300"></iframe>
    </section>
  </main>
  <footer><p>Week 2 HTML Practical</p></footer>
